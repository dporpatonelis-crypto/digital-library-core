(function(root,factory){const api=factory();if(typeof module==='object'&&module.exports)module.exports=api;else root.PatristicScriptureCrossReferences=api;})(typeof globalThis!=='undefined'?globalThis:this,function(){

  let serial=0;
  const TYPES=['verbal','paraphrase','combination','thematic'];
  const fail=message=>{throw new Error('PatristicScriptureCrossReferences: '+message);};
  const hasText=value=>typeof value==='string'&&value.trim().length>0;
  function prepare(input){
    let data;try{data=JSON.parse(JSON.stringify(input));}catch{fail('Τα δεδομένα πρέπει να είναι έγκυρο JSON.');}

    if(data.comparison){for(const name of ['kind','title','kicker','selectionLabel'])if(data.comparison[name]!==undefined&&!hasText(data.comparison[name]))fail('Μη έγκυρη ονομασία πηγών.');if(data.comparison.selectWholePassage!==undefined&&typeof data.comparison.selectWholePassage!=='boolean')fail('Μη έγκυρη επιλογή ολόκληρου χωρίου.');}

    if(!Array.isArray(data.scriptures)||!data.scriptures.length||!Array.isArray(data.sources)||!Array.isArray(data.relations))fail('Λείπουν τα βιβλικά χωρία, οι πηγές ή οι συσχετίσεις.');

    for(const s of data.sources){

      if(!Array.isArray(values)||!values.length)fail('Λείπουν οι παράγραφοι του κειμένου.');
      for(const b of values){
        if(!b||!hasText(b.id)||blockIds.has(b.id)||typeof b.text!=='string'||!Array.isArray(b.segments)||!b.segments.length)fail('Μη έγκυρο ή διπλό ID παραγράφου.');
        blockIds.add(b.id);let joined='';

          joined+=segment.text;
          if(segment.id!==undefined){if(!hasText(segment.id)||spans.has(segment.id))fail('Μη έγκυρο ή διπλό text-span ID.');spans.set(segment.id,{...segment,side,passageId,blockId:b.id});}
        }

    }
    blocks(data.patristic.paragraphs,'patristic',null);
    if(data.patristic.paragraphs.map(p=>p.text).join('\n\n')!==data.patristic.text)fail('Οι παράγραφοι αλλοιώνουν το πατερικό πρωτότυπο.');
    for(const p of data.scriptures){
      if(!p||!hasText(p.id)||passages.has(p.id)||!hasText(p.reference)||!sources.has(p.sourceId))fail('Μη έγκυρο βιβλικό χωρίο ή πηγή.');

    }
    const index=new Map();
    for(const r of data.relations){
      if(!r||!hasText(r.id)||relations.has(r.id)||!TYPES.includes(r.type)||r.reviewed!==true)fail('Μη ελεγμένη ή μη έγκυρη συσχέτιση.');
      for(const[field,side]of [['patristicSpanIds','patristic'],['scriptureSpanIds','scripture']]){
        const ids=r[field];if(!Array.isArray(ids)||!ids.length||new Set(ids).size!==ids.length||ids.some(id=>spans.get(id)?.side!==side))fail('Η συσχέτιση δείχνει σε άγνωστο ή λανθασμένο text-span ID: '+r.id);
      }
      const e=r.evidence;
      if(!e||!hasText(e.method)||!hasText(e.patristicReference)||!hasText(e.scriptureReference)||!Array.isArray(e.sourceIds)||!e.sourceIds.length||e.sourceIds.some(id=>!sources.has(id)))fail('Η συσχέτιση δεν έχει τεκμηρίωση: '+r.id);
      const citedSources=[data.patristic.sourceId,...r.scriptureSpanIds.map(id=>passages.get(spans.get(id).passageId).sourceId)];
      if(citedSources.some(id=>!e.sourceIds.includes(id)))fail('Η τεκμηρίωση δεν καλύπτει και τα δύο πρωτότυπα: '+r.id);

      for(const id of [...r.patristicSpanIds,...r.scriptureSpanIds]){if(!index.has(id))index.set(id,new Set());index.get(id).add(r.id);}

  function prepareLibrary(input){

    for(const view of data.views){if(!view||!hasText(view.id)||!hasText(view.label)||views.has(view.id)||!groups.has(view.groupId))fail('Μη έγκυρη ή διπλή προβολή κειμένων.');prepare(view.dataset);views.set(view.id,view);}
    if([...groups.keys()].some(id=>!data.views.some(v=>v.groupId===id)))fail('Κενή ομάδα πηγών.');

  }
  function validate(input){try{if(input?.views)prepareLibrary(input);else prepare(input);return{valid:true,errors:[]};}catch(error){return{valid:false,errors:[error.message]};}}
  function mountLibrary(container,input){

    let library=prepareLibrary(input),activeId=null,destroyed=false,cache=new Map(),lastGroupView=new Map(),buttons=new Map(),select,label,stage;
    function node(tag,cls,text){const e=doc.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e;}
    function announce(){root.dispatchEvent(new view.CustomEvent('patristic-study-view-change',{bubbles:true,detail:{libraryId:library.data.id,viewId:activeId,groupId:library.views.get(activeId).groupId}}));}
    function show(id,emit=true){
      if(destroyed)return;if(!library.views.has(id))fail('Η προβολή δεν βρέθηκε: '+id);if(activeId===id)return;
      if(activeId){const old=cache.get(activeId);old.scroll=[...old.host.querySelectorAll('.psc-scroll')].map(e=>e.scrollTop);old.host.remove();}
      const item=library.views.get(id);let entry=cache.get(id);
      if(!entry){const host=node('div','psc-library-view');entry={host,instance:mount(host,item.dataset),scroll:[0,0]};cache.set(id,entry);}
      stage.append(entry.host);activeId=id;root.dataset.activeView=id;lastGroupView.set(item.groupId,id);
      const peers=library.data.views.filter(v=>v.groupId===item.groupId);select.replaceChildren();
      for(const peer of peers){const option=node('option','',peer.label);option.value=peer.id;select.append(option);}select.value=id;
      label.firstChild.textContent=library.groups.get(item.groupId).selectorLabel||'Επιλογή κειμένου';label.hidden=peers.length===1;
      for(const[groupId,b]of buttons)b.setAttribute('aria-pressed',String(groupId===item.groupId));

    }
    function render(){
      root.replaceChildren();root.setAttribute('aria-label',library.data.title||'Μελέτη πηγών');buttons=new Map();const toolbar=node('div','psc-library-toolbar'),groups=node('nav','psc-library-groups');groups.setAttribute('aria-label','Επιλογή πηγών');
      for(const group of library.data.groups){const b=node('button','',group.label);b.type='button';b.dataset.pscGroup=group.id;b.setAttribute('aria-pressed','false');groups.append(b);buttons.set(group.id,b);}
      label=node('label','psc-library-picker');label.append(doc.createTextNode('Επιλογή κειμένου'));select=node('select','');select.dataset.pscView='';label.append(select);toolbar.append(groups,label);stage=node('div','psc-library-stage');root.append(toolbar,stage);

      clearSelection(){if(!destroyed)cache.get(activeId).instance.clearSelection();},
      clearAllSelections(){if(!destroyed)for(const entry of cache.values())entry.instance.clearSelection();},

  function mount(container,input){

    function node(tag,cls,text){const e=doc.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e;}

ωτιστούν τα σχετικά σημεία και στα δύο κείμενα.", "relationTypeLabels": {"verbal": "Λεκτική", "paraphrase": "Παράφραση", "combination": "Συνδυασμός", "thematic": "Θεματική"}, "comparison": {"kind": "hymn", "title": "Ύμνος", "kicker": "ΛΕΙΤΟΥΡΓΙΚΟ ΠΡΩΤΟΤΥΠΟ", "selectionLabel": "Σχετικός ύμνος", "selectWholePassage": false}, "patristic": {"id": "gregory-31-29-text", "author": "Γρηγόριος ο Θεολόγος", "title": "Τα ονόματα, οι ιδιότητες και οι ενέργειες του Αγίου Πνεύματος", "reference": "Ε΄ Θεολογικός Λόγος (Λόγος ΛΑ΄), §29", "sourceId": "gregory-31-29", "text": "Ἐγὼ μὲν φρίττω τὸν πλοῦτον ἐννοῶν τῶν κλήσεων, καὶ καθ’ ὅσων ὀνομάτων ἀναισχυντοῦσιν οἱ τῷ Πνεύματι ἀντιπίπτοντες.\n\nΠνεῦμα Θεοῦ λέγεται, Πνεῦμα Χριστοῦ, Νοῦς Χριστοῦ, Πνεῦμα Κυρίου, αὐτὸ Κύριος· Πνεῦμα υἱοθεσίας, ἀληθείας, ἐλευθερίας· Πνεῦμα σοφίας, συνέσεως, βουλῆς, ἰσχύος, γνώσεως, εὐσεβείας, φόβου Θεοῦ· καὶ γὰρ ποιητικὸν τούτων ἁπάντων.\n\nΠάντα τῇ οὐσίᾳ πληροῦν, πάντα συνέχον· πληρωτικὸν κόσμου κατὰ τὴν οὐσίαν, ἀχώρητον κόσμῳ κατὰ τὴν δύναμιν· ἀγαθόν, εὐθές, ἡγεμονικόν, φύσει οὐ θέσει· ἁγιάζον, οὐχ ἁγιαζόμενον, μετροῦν, οὐ μετρούμενον.\n\nΜετεχόμενον, οὐ μετέχον, πληροῦν, οὐ πληρούμενον, συνέχον, οὐ συνεχόμενον· κληρονομούμενον, δοξαζόμενον, συναριθμούμενον, ἐπαπειλούμενον· δάκτυλος Θεοῦ, πῦρ ὡς Θεός, εἰς ἔμφασιν, οἶμαι, τοῦ ὁμοουσίου.\n\nΠνεῦμα τὸ ποιῆσαν, τὸ ἀνακτίζον διὰ βαπτίσματος, δι’ ἀναστάσεως· Πνεῦμα τὸ γινῶσκον ἅπαντα, τὸ διδάσκον, τὸ πνέον ὅπου θέλει καὶ ὅσον, ὁδηγοῦν, λαλοῦν, ἀποστέλλον, ἀφορίζον, παροξυνόμενον, πειραζόμενον· ἀποκαλυπτικόν, φωτιστικόν, ζωτικόν, μᾶλλον δὲ αὐτοφῶς καὶ ζωή.\n\nΝαοποιοῦν, θεοποιοῦν, τελειοῦν, ὥστε καὶ προλαμβάνειν τὸ βάπτισμα, καὶ ἐπιζητεῖσθαι μετὰ τὸ βάπτισμα· ἐνεργοῦν ὅσα Θεός, μεριζόμενον ἐν γλώσσαις πυρίναις, διαιροῦν χαρίσματα, ποιοῦν ἀποστόλους, προφήτας, εὐαγγελιστάς, ποιμένας καὶ διδασκάλους.\n\nΝοερόν, πολυμερές, σαφές, τρανόν, ἀκώλυτον, ἀμόλυντον· ὅπερ ἴσον δύναται τὸ σοφώτατον καὶ πολύτροπον ταῖς ἐνεργείαις, καὶ σαφηνιστικὸν πάντων, καὶ τρανωτικόν, καὶ
